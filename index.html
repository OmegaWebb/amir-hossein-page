<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030303">

<title>AMIR HOSIN SHAD</title>
<meta name="description" content="Amir Hosin Shad — Private Digital Card">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================= RESET ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --black: #030303;
    --gold: #d4af37;
    --gold-light: #fff0a0;
    --red: #700000;
    --white: #f5f5f5;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 5%, rgba(120,0,0,.22), transparent 32%),
        radial-gradient(circle at 10% 90%, rgba(212,175,55,.07), transparent 25%),
        var(--black);
    color: white;
    font-family: "Inter", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    overflow-x: hidden;
}

/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.red-light {
    position: absolute;
    width: 480px;
    height: 480px;
    top: -230px;
    left: 50%;
    transform: translateX(-50%);
    background: #700000;
    filter: blur(170px);
    opacity: .16;
    animation: redLight 7s ease-in-out infinite alternate;
}

.gold-light {
    position: absolute;
    width: 300px;
    height: 300px;
    right: -150px;
    bottom: -130px;
    background: var(--gold);
    filter: blur(170px);
    opacity: .05;
    animation: goldLight 8s ease-in-out infinite alternate;
}

@keyframes redLight {
    from {
        transform: translateX(-50%) scale(.8);
        opacity: .09;
    }
    to {
        transform: translateX(-50%) scale(1.2);
        opacity: .23;
    }
}

@keyframes goldLight {
    from { transform: translate(0,0); }
    to { transform: translate(-130px,-100px); }
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 9px var(--gold);
    opacity: .3;
    animation: particleMove linear infinite;
}

.p1 { left: 8%; top: 20%; animation-duration: 9s; }
.p2 { left: 22%; top: 70%; animation-duration: 13s; }
.p3 { left: 45%; top: 25%; animation-duration: 11s; }
.p4 { left: 70%; top: 78%; animation-duration: 15s; }
.p5 { left: 91%; top: 25%; animation-duration: 10s; }
.p6 { left: 58%; top: 90%; animation-duration: 12s; }
.p7 { left: 14%; top: 45%; animation-duration: 14s; }
.p8 { left: 83%; top: 53%; animation-duration: 8s; }

@keyframes particleMove {
    0% {
        transform: translateY(30px);
        opacity: 0;
    }
    40% { opacity: .55; }
    100% {
        transform: translateY(-120px);
        opacity: 0;
    }
}

/* ================= MAIN CARD ================= */

.card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 430px;
    padding: 34px 24px 20px;
    border-radius: 30px;
    background: linear-gradient(
        145deg,
        rgba(255,255,255,.065),
        rgba(255,255,255,.012)
    );
    border: 1px solid rgba(212,175,55,.25);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        0 40px 100px rgba(0,0,0,.85),
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 60px rgba(100,0,0,.08);
    overflow: hidden;
    animation: cardEnter 1.1s cubic-bezier(.16,1,.3,1) forwards;
    opacity: 0;
    transform: translateY(30px) scale(.96);
}

@keyframes cardEnter {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(
        120deg,
        transparent 20%,
        var(--gold),
        var(--red),
        transparent 80%
    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: borderRotate 6s linear infinite;
    pointer-events: none;
}

@keyframes borderRotate {
    to { filter: hue-rotate(25deg); }
}

.top-line {
    position: absolute;
    top: 0;
    left: 20%;
    width: 60%;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        var(--gold-light),
        var(--gold),
        transparent
    );
    box-shadow: 0 0 14px rgba(212,175,55,.7);
    animation: linePulse 3s ease-in-out infinite;
}

@keyframes linePulse {
    0%,100% { opacity: .45; }
    50% { opacity: 1; }
}

/* ================= PROFILE ================= */

.profile {
    text-align: center;
    position: relative;
    z-index: 2;
}

.avatar-wrapper {
    position: relative;
    width: 125px;
    height: 125px;
    margin: 0 auto 22px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.avatar-wrapper::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(
        from 0deg,
        transparent,
        var(--gold),
        transparent,
        #800000,
        transparent
    );
    animation: rotateRing 6s linear infinite;
    filter: drop-shadow(0 0 8px rgba(212,175,55,.3));
}

@keyframes rotateRing {
    to { transform: rotate(360deg); }
}

.avatar-wrapper::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,.35);
}

.avatar {
    position: relative;
    z-index: 2;
    width: 115px;
    height: 115px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #050505;
    background: #111;
    box-shadow:
        0 0 0 2px rgba(212,175,55,.3),
        0 0 35px rgba(120,0,0,.3);
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border-radius: 30px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
    color: #999;
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b30000;
    box-shadow: 0 0 8px #b30000;
    animation: statusPulse 2s infinite;
}

@keyframes statusPulse {
    50% { opacity: .3; }
}

.name {
    font-family: "Cinzel", serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--white);
    text-shadow: 0 0 25px rgba(255,255,255,.08);
    margin-bottom: 8px;
}

.subtitle {
    color: #a88936;
    font-size: 9px;
    letter-spacing: 5px;
    font-weight: 600;
}

/* ================= ORNAMENT ================= */

.ornament {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 27px 0;
}

.ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(212,175,55,.35)
    );
}

.ornament-line:last-child {
    background: linear-gradient(
        90deg,
        rgba(212,175,55,.35),
        transparent
    );
}

.ornament-symbol {
    color: var(--gold);
    font-size: 11px;
    text-shadow: 0 0 10px rgba(212,175,55,.5);
}

/* ================= SOCIAL LINKS ================= */

.links {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.link {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 67px;
    padding: 9px 13px;
    text-decoration: none;
    color: white;
    border-radius: 17px;
    background: linear-gradient(
        110deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.015)
    );
    border: 1px solid rgba(255,255,255,.065);
    overflow: hidden;
    transition:
        transform .35s cubic-bezier(.16,1,.3,1),
        border-color .35s,
        box-shadow .35s;
}

.link::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 80%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.07),
        transparent
    );
    transform: skewX(-20deg);
    transition: .7s;
    pointer-events: none;
}

.link:hover::before {
    left: 140%;
}

.link:hover {
    transform: translateY(-4px) scale(1.015);
    border-color: rgba(212,175,55,.32);
    box-shadow:
        0 15px 35px rgba(0,0,0,.45),
        0 0 20px rgba(212,175,55,.05);
}

/* ================= SVG ICONS ================= */

.icon {
    width: 46px;
    height: 46px;
    min-width: 46px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 14px;
    margin-right: 13px;
    background: linear-gradient(145deg,#1b1b1b,#080808);
    border: 1px solid rgba(212,175,55,.22);
    color: var(--gold);
    transition: .35s;
}

.icon svg {
    width: 25px;
    height: 25px;
    display: block;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform .35s, filter .35s;
}

.link:hover .icon {
    background: linear-gradient(145deg,#400000,#0b0b0b);
    color: #fff0a0;
    border-color: rgba(212,175,55,.6);
    box-shadow: 0 0 18px rgba(120,0,0,.25);
}

.link:hover .icon svg {
    transform: scale(1.12);
    filter: drop-shadow(0 0 5px currentColor);
}

/* PHONE */

.phone-icon svg {
    fill: currentColor;
    stroke: none;
}

/* TELEGRAM */

.telegram-icon svg {
    fill: currentColor;
    stroke: none;
}

/* INSTAGRAM */

.instagram-icon svg {
    stroke-width: 1.9;
}

.instagram-icon .ig-dot {
    fill: currentColor;
    stroke: none;
}

/* WHATSAPP */

.whatsapp-icon svg {
    stroke-width: 1.9;
}

.whatsapp-icon .wa-phone {
    fill: currentColor;
    stroke: none;
}

/* ================= LINK TEXT ================= */

.link-info {
    flex: 1;
    text-align: left;
    min-width: 0;
}

.link-title {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
}

.link-value {
    display: block;
    font-size: 10px;
    color: #777;
    letter-spacing: .5px;
    overflow-wrap: anywhere;
}

.arrow {
    color: #444;
    font-size: 12px;
    transition: .35s;
    margin-left: 8px;
}

.link:hover .arrow {
    color: var(--gold);
    transform: translateX(4px);
}

/* ================= OMEGA BRAND ================= */

.omega-section {
    position: relative;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.055);
    text-align: center;
}

.omega-powered {
    font-size: 7px;
    letter-spacing: 4px;
    color: #666;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.omega-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: 10px 18px;
    border-radius: 14px;
    text-decoration: none;
    overflow: hidden;
    background: linear-gradient(
        135deg,
        rgba(212,175,55,.08),
        rgba(100,0,0,.10)
    );
    border: 1px solid rgba(212,175,55,.18);
    transition: .4s cubic-bezier(.16,1,.3,1);
    box-shadow: inset 0 0 20px rgba(255,255,255,.015);
}

.omega-link::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.09),
        transparent
    );
    transform: skewX(-20deg);
    transition: .8s;
}

.omega-link:hover::before {
    left: 130%;
}

.omega-logo {
    position: relative;
    width: 30px;
    height: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,.5);
    color: var(--gold);
    font-family: "Cinzel", serif;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 0 15px rgba(212,175,55,.08);
    transition: .4s;
}

.omega-logo::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 1px solid rgba(139,0,0,.7);
}

.omega-name {
    font-family: "Cinzel", serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ddd;
    transition: .4s;
}

.omega-mini {
    display: block;
    font-size: 6px;
    letter-spacing: 2px;
    color: #8b7846;
    margin-top: 2px;
}

.omega-link:hover {
    transform: translateY(-4px) scale(1.04);
    border-color: rgba(212,175,55,.5);
    box-shadow:
        0 12px 30px rgba(0,0,0,.45),
        0 0 25px rgba(212,175,55,.09);
}

.omega-link:hover .omega-logo {
    color: white;
    border-color: var(--gold);
    box-shadow: 0 0 18px rgba(212,175,55,.3);
    transform: rotate(180deg);
}

.omega-link:hover .omega-name {
    color: var(--gold);
    letter-spacing: 5px;
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    margin-top: 14px;
    color: #555;
    font-size: 7px;
    letter-spacing: 3px;
}

.footer span {
    color: var(--red);
}

/* ================= MOBILE ================= */

@media (max-width: 480px) {
    body {
        padding: 14px;
    }

    .card {
        padding: 30px 17px 18px;
        border-radius: 26px;
    }

    .avatar-wrapper {
        width: 115px;
        height: 115px;
    }

    .avatar {
        width: 105px;
        height: 105px;
    }

    .name {
        font-size: 23px;
        letter-spacing: 1.5px;
    }

    .subtitle {
        font-size: 8px;
        letter-spacing: 4px;
    }

    .link {
        min-height: 64px;
    }

    .omega-link {
        padding: 9px 16px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
